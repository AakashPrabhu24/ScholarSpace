<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Timetable Maker{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'timetable_app/css/style.css' %}">
</head>
<body>
    <header>
        <h1>Student Timetable Maker</h1>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>&copy; {% now "Y" %} Student Timetable Maker</p>
    </footer>
    
    <script src="{% static 'timetable_app/js/main.js' %}"></script>
</body>
</html>
