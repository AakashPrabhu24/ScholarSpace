{% extends 'dashboard/base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}

<style>
    /* Animated Background with Floating Glow */
   body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto; /* Enable vertical scrolling */
}


    /* Floating Glow Effect */
    @keyframes floatingGlow {
        0% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); }
        50% { box-shadow: 0 0 50px rgba(0, 255, 255, 0.8); }
        100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); }
    }

    .floating-bg {
        position: absolute;
        width: 200px;
        height: 200px;
        background: rgba(0, 255, 255, 0.2);
        border-radius: 50%;
        top: 10%;
        left: 10%;
        animation: floatingGlow 3s infinite alternate ease-in-out;
    }

    /* 3D Floating Card Effect */
    .card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
    }

    .card:hover {
        transform: translateY(-12px) scale(1.05);
        box-shadow: 0 15px 50px rgba(0, 255, 255, 0.6);
    }

    /* 3D Trash Icon */
    .fa-trash {
        transition: transform 0.3s ease-in-out, text-shadow 0.3s ease-in-out;
        color: #ff5252;
    }

    .fa-trash:hover {
        transform: rotate(20deg) scale(1.3);
        text-shadow: 0 0 15px rgba(255, 0, 0, 0.9);
    }

    /* 3D Button with Press Effect */
    .btn-3d {
        background: linear-gradient(145deg, #12232e, #203a43);
        border: none;
        color: white;
        padding: 12px;
        font-size: 18px;
        border-radius: 8px;
        box-shadow: 4px 4px 8px #0d1b24, -4px -4px 8px #30555f;
        transition: all 0.2s ease-in-out;
        width: 100%;
        position: relative;
    }

    .btn-3d:hover {
        transform: scale(1.05);
    }

    .btn-3d:active {
        box-shadow: inset 4px 4px 8px #0d1b24, inset -4px -4px 8px #30555f;
        transform: translateY(2px);
    }

    /* Form Styling */
    .form-container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
    }
</style>

<!-- Floating Glow Background -->
<div class="floating-bg"></div>

<!-- Notes Section -->
<div class="container">
    <div class="row d-flex justify-content-center">
        {% for note in notes %}
        <div class="col-md-3 mb-4">
            <a href="{% url 'notes-detail' note.id %}" class="text-decoration-none">
                <div class="card text-center p-3">
                    <div class="card-header">{{ note.title }}</div>
                    <div class="card-body">
                        {{ note.description|slice:"0:100" }}
                    </div>
                    <div class="card-footer mt-auto">
                        <a href="{% url 'delete-note' note.id %}" class="text-danger">
                            <i class="fa fa-trash fa-2x"></i>
                        </a>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>

<br>

<!-- Create Notes Form -->
<div class="container">
    <div class="form-container">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4 text-white">📝 Create Notes</legend>
            </fieldset>
            {{ form|crispy }}
            <div class="form-group mt-3">
                <button class="btn-3d" type="submit">➕ Create Note</button>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
