<script>

      document.documentElement.classList.remove('light');
      document.documentElement.classList.add('dark');

      document.documentElement.classList.add('light');

<style>
  body { font-family: 'Inter', sans-serif; }
  h1, h2, h3, .brand-font { font-family: 'Plus Jakarta Sans', sans-serif; }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .text-editorial-label {
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes scholar-page-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .scholar-page-fade {
    animation: scholar-page-fade-in 0.38s ease-out;
  }
  .scholar-top-nav {
    view-transition-name: scholar-top-nav;
  }
  html.scholar-vt-enabled .scholar-page-fade {
    animation: none !important;
  }
  @supports (view-transition-name: none) {
    ::view-transition-old(scholar-top-nav),
    ::view-transition-new(scholar-top-nav) {
      animation: none !important;
    }
    html.scholar-vt-enabled ::view-transition-old(root) {
      animation: none !important;
    }
    html.scholar-vt-enabled ::view-transition-new(root) {
      animation: scholar-vt-fade-in 0.22s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
  }
  @keyframes scholar-vt-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scholar-vt-fade-out { from { opacity: 1; } to { opacity: 0; } }

  /* Options menu: not reliant on Tailwind JIT for group-hover (CDN often misses it) */
  [data-scholar-options] {
    position: relative;
  }
  [data-scholar-options] .scholar-options-panel {
    position: absolute;
    left: 0;
    top: 100%;
    z-index: 200;
    min-width: 13rem;
    width: 13rem;
    padding-top: 0.375rem;
    margin: 0;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.15s ease, visibility 0.15s ease;
  }
  [data-scholar-options].is-open .scholar-options-panel {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
</style>
<script>
  (function () {
    if (document.startViewTransition) {
      document.documentElement.classList.add('scholar-vt-enabled');
    }
  })();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!document.startViewTransition) return;
    document.querySelectorAll('a[data-scholar-vt]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (a.getAttribute('target') === '_blank') return;
        var href = a.getAttribute('href');
        if (!href || href.startsWith('#') || a.hasAttribute('download')) return;
        try {
          var u = new URL(href, window.location.href);
          if (u.origin !== window.location.origin) return;
        } catch (err) { return; }
        e.preventDefault();
        document.startViewTransition(function () { window.location.href = href; });
      });
    });
  });
</script>
