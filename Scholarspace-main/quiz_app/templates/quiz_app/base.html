<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Test Series{% endblock %}</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #333;
      line-height: 1.6;
    }

    .container {
      width: 85%;
      max-width: 1200px;
      margin: 20px auto;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    /* Dark header styling */
    header {
      background: #222;  /* Dark background */
      color: #fff;       /* White text */
      padding: 20px 0;
      border-bottom: 2px solid #e8491d;
      margin-bottom: 30px;
      border-radius: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header #branding h1 {
      margin: 0;
      font-weight: 600;
    }

    header nav ul {
      padding: 0;
      margin: 0;
      list-style: none;
      display: flex;
    }

    header nav ul li {
      margin-left: 25px;
    }

    header nav a {
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    header nav a:hover, header nav .current a {
      color: #e8491d;
      font-weight: 600;
    }

    .btn {
      display: inline-block;
      background: #e8491d;
      color: white;
      padding: 12px 25px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-size: 16px;
      border-radius: 5px;
      transition: background 0.3s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      background: #ff6a3c;
    }

    .quiz-box {
      background: #fff;
      padding: 30px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    form input, form textarea, form select {
      width: calc(100% - 22px);
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }

    form label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .radio-group {
      margin-bottom: 20px;
    }

    .radio-group label {
      display: inline-flex;
      align-items: center;
      margin-right: 20px;
    }

    .radio-group input[type="radio"] {
      width: auto;
      margin-right: 8px;
    }

    @media (max-width: 768px) {
      .container {
        width: 95%;
        padding: 20px;
      }

      header .container {
        flex-direction: column;
        align-items: flex-start;
      }

      header nav ul {
        flex-direction: column;
        margin-top: 15px;
      }

      header nav ul li {
        margin-left: 0;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div id="branding">
        <h1><span class="highlight">Test</span> Series</h1>
      </div>
      <nav>
        <ul>
          <li><a href="{% url 'quiz_app:index' %}">Home</a></li>
          <li><a href="{% url 'quiz_app:quiz_list' %}">Test</a></li>
          <li><a href="{% url 'quiz_app:create_quiz' %}">Create Quiz</a></li>
          <li><a href="/admin/">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    {% block content %}
    {% endblock %}
  </div>
</body>
</html>
