{% extends 'quiz_app/base.html' %}

{% block title %}Add Question to {{ quiz.title }}{% endblock %}

{% block content %}
    <div class="quiz-box">
        <h2>Add Question to "{{ quiz.title }}"</h2>
        
        <form method="post">
            {% csrf_token %}
            
            <div>
                <label for="question_text">Question:</label>
                <input type="text" id="question_text" name="question_text" required>
            </div>
            
            <div>
                <label for="answer1">Answer 1:</label>
                <input type="text" id="answer1" name="answer1" required>
            </div>
            
            <div>
                <label for="answer2">Answer 2:</label>
                <input type="text" id="answer2" name="answer2" required>
            </div>
            
            <div>
                <label for="answer3">Answer 3:</label>
                <input type="text" id="answer3" name="answer3" required>
            </div>
            
            <div>
                <label for="answer4">Answer 4:</label>
                <input type="text" id="answer4" name="answer4" required>
            </div>
            
            <div class="radio-group">
                <label>Correct Answer:</label>
                <input type="radio" id="correct1" name="correct_answer" value="1" required>
                <label for="correct1">Answer 1</label>
                
                <input type="radio" id="correct2" name="correct_answer" value="2">
                <label for="correct2">Answer 2</label>
                
                <input type="radio" id="correct3" name="correct_answer" value="3">
                <label for="correct3">Answer 3</label>
                
                <input type="radio" id="correct4" name="correct_answer" value="4">
                <label for="correct4">Answer 4</label>
            </div>
            
            <button type="submit" name="add_another" class="btn">Save & Add Another</button>
            <button type="submit" class="btn">Save & Finish</button>
        </form>
    </div>
{% endblock %}
